<!DOCTYPE html>
<html>

<head>
    <title>Customer Registration - Easy Car Rental</title>
</head>

<body>

    <h1 align="center"> EASY CAR RENTAL</h1>
    <h2 align="center">Customer Registration Form</h2>

    

    <form action="" method="post">

        <label for="fullname">Full Name:</label><br>
        <input type="text" id="fullname" name="fullname" required>
        <br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="phone">Phone Number:</label><br>
        <input type="tel" id="phone" name="phone" required>
        <br><br>

        <label for="dob">Date of Birth:</label><br>
        <input type="date" id="dob" name="dob" required>
        <br><br>

        <label>Gender:</label><br>

        <input type="radio" id="male" name="gender" value="Male" required>
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label>
        <br><br>

        <label for="address">Address:</label><br>
        <textarea id="address" name="address" rows="4" cols="30" required></textarea>
        <br><br>

        <label for="license">Driving License:</label><br>
        <input type="text" id="license" name="license" required>
        <br><br>

        <label for="nid">NID Number:</label><br>
        <input type="text" id="nid" name="nid" required>
        <br><br>

        <label for="username">Username:</label><br>
        <input type="text" id="username" name="username" required>
        <br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required>
        <br><br>

        <label for="confirm_password">Confirm Password:</label><br>
        <input type="password" id="confirm_password" name="confirm_password" required>
        <br><br>

        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">I agree to the Terms and Conditions.</label>
        <br><br>

        <button type="submit">Register</button>
        <button type="reset">Reset</button>

        <p>
            Already have an account?
            <a href="login.html">Login Here</a>
        </p>

        <a href="index.html">Back to Home</a>

    </form>

</body>

</html>
