<!DOCTYPE html> 
<html> 
 
<head> 
    <title>Customer Registration - Easy Car Rental</title> 
</head> 
 
<body> 
 
    <h1 align="center">🚗 EASY CAR RENTAL</h1> 
    <h2 align="center">Customer Registration Form</h2> 
 
    <hr> 
 
    <form action="#" method="post"> 
 
        <table align="center" cellpadding="8"> 
 
            <tr> 
                <td><label for="fullname">Full Name:</label></td> 
                <td><input type="text" id="fullname" name="fullname" required></td> 
            </tr> 
 
            <tr> 
                <td><label for="email">Email:</label></td> 
                <td><input type="email" id="email" name="email" required></td> 
            </tr> 
 
            <tr> 
                <td><label for="phone">Phone Number:</label></td> 
                <td><input type="tel" id="phone" name="phone" required></td> 
            </tr> 
 
            <tr> 
                <td><label for="dob">Date of Birth:</label></td> 
                <td><input type="date" id="dob" name="dob" required></td> 
            </tr> 
 
            <tr> 
                <td>Gender:</td> 
                <td> 
                    <input type="radio" id="male" name="gender" value="Male" required> 
                    <label for="male">Male</label> 
 
                    <input type="radio" id="female" name="gender" value="Female"> 
                    <label for="female">Female</label> 
 
                    <input type="radio" id="other" name="gender" value="Other"> 
                    <label for="other">Other</label> 
                </td> 
            </tr> 
 
            <tr> 
                <td><label for="address">Address:</label></td> 
                <td> 
                    <textarea id="address" name="address" rows="4" cols="30" required></textarea> 
                </td> 
            </tr> 
 
            <tr> 
                <td><label for="license">Driving License:</label></td> 
                <td><input type="text" id="license" name="license" required></td> 
            </tr> 
 
            <tr> 
                <td><label for="nid">NID Number:</label></td> 
                <td><input type="text" id="nid" name="nid" required></td> 
            </tr> 
 
            <tr> 
                <td><label for="username">Username:</label></td> 
                <td><input type="text" id="username" name="username" required></td> 
            </tr> 
 
            <tr> 
                <td><label for="password">Password:</label></td> 
                <td><input type="password" id="password" name="password" required></td> 
            </tr> 
 
            <tr> 
                <td><label for="confirm_password">Confirm Password:</label></td> 
                <td><input type="password" id="confirm_password" name="confirm_password" required></td> 
            </tr> 
 
            <tr> 
                <td colspan="2" align="center"> 
                    <input type="checkbox" id="terms" name="terms" required> 
                    <label for="terms">I agree to the Terms and Conditions.</label> 
                </td> 
            </tr> 
 
            <tr> 
                <td colspan="2" align="center"> 
                    <input type="submit" value="Register"> 
                    <input type="reset" value="Reset"> 
                </td> 
            </tr> 
 
            <tr> 
                <td colspan="2" align="center"> 
                    <p> 
                        Already have an account? 
                        <a href="login.html">Login Here</a> 
                    </p> 
                </td> 
            </tr> 
 
            <tr> 
                <td colspan="2" align="center"> 
                    <a href="index.html">Back to Home</a> 
                </td> 
            </tr> 
 
        </table> 
 
    </form> 
 
</body> 
 
</html>
