<h1>Driver Registration</h1>
<p>Join our team and become a part of Easy Car Rental</p>
<hr>

<form action=" " method="post">

<Label for="name">Full Name :</Label><br>
<input type="text" id="name" placeholder="Enter Your Full Name" required>
<br><br>

<label for="email">Email:</label><br>
<input type="text" id="email" placeholder="Enter Your Email address" required>
<br><br>

<label for="phone">Phone:</label><br>
<input type="text" id="phone" placeholder="Enter your phone number" required>
<br><br>

<Label for="address">Address:</Label><br>
<textarea id="address" rows="4" cols="30" placeholder="Enter the address" required></textarea><br><br>
 
<label for="dvli">Driving License Number :</label><br>
<input type="text" id="dvli" placeholder="Enter your driving license number" required><br><br>

<label for="expirydate">License Expiry Date :</label><br>
<input type="date" id="expirydate" required>
<br><br>

<label for="expri">Driving Experience (Years):</label><br>
<select id="expri" required>
    <option value="">Select experience</option>
    <option value="1-3y">1-3 Year</option>
    <option value="3-7y">3-7 Year</option>
    <option value="7-10y">7-10 Year</option>
    <option value="10y">More than 10 Years</option>

</select>
<br> <br>

<label for="pass">Password:</label><br>
<input type="text" id="pass" placeholder="Create a strong Password " required>
<br> <br>


<button type="submit">Register</button>
 <button type="reset">Reset</button> 
 <br><br>
 
 <p>Already have an account?<a href="login.html">Login</a> </p>

 <hr>

</form>
