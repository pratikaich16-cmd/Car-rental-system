<!DOCTYPE html>
<html>

<head>
    <title>Worker Registration - Easy Car Rental</title>
</head>

<body>

    <h1 align="center"> EASY CAR RENTAL</h1>
    <h2 align="center">Worker Registration Form</h2>


    <form action="" method="post">

        <fieldset>
            <legend><b>Personal Information</b></legend>

            <br>

            <label for="name"><b>Full Name:</b></label>
            <br>
            <input type="text" id="name" name="name"
                   placeholder="Enter your full name" required>

            <br><br>

            <label for="email"><b>Email:</b></label>
            <br>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>

            <br><br>

            <label for="phone"><b>Phone Number:</b></label>
            <br>
            <input type="tel" id="phone" name="phone"
                   placeholder="01XXXXXXXXX" required>

            <br><br>

            <label for="address"><b>Address:</b></label>
            <br>
            <textarea id="address" name="address" rows="3" cols="30"
                      placeholder="Enter your address" required></textarea>

            <br><br>

            <b>Gender:</b>
            <br>

            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>

            <input type="radio" id="other" name="gender" value="other">
            <label for="other">Other</label>

            <br><br>
        </fieldset>

        <br>

        <fieldset>
            <legend><b>Account Information</b></legend>

            <br>

            <label for="username"><b>Username:</b></label>
            <br>
            <input type="text" id="username" name="username"
                   placeholder="Choose a username" required>

            <br><br>

            <label for="password"><b>Password:</b></label>
            <br>
            <input type="password" id="password" name="password"
                   placeholder="Enter your password" required>

            <br><br>

            <label for="confirm_password"><b>Confirm Password:</b></label>
            <br>
            <input type="password" id="confirm_password"
                   name="confirm_password"
                   placeholder="Re-enter your password" required>

            <br><br>
        </fieldset>

        <br>

        <fieldset>
            <legend><b>Rental Preferences</b></legend>

            <br>

            <label for="car_type"><b>Preferred Car Type:</b></label>
            <br>

            <select id="car_type" name="car_type" required>
                <option value="">-- Select Car Type --</option>
                <option value="sedan">Sedan</option>
                <option value="suv">SUV</option>
                <option value="hatchback">Hatchback</option>
                <option value="luxury">Luxury Car</option>
            </select>

            <br><br>

            <label for="license"><b>Driving License Number:</b></label>
            <br>
            <input type="text" id="license" name="license"
                   placeholder="Enter license number">

            <br><br>
        </fieldset>

        <br>

        <input type="submit" value="Register">
        <input type="reset" value="Reset">

        <p>
            Already have an account?
            <a href="login.html">Login Here</a>
        </p>

        <a href="index.html">Back to Home</a>

    </form>

</body>

</html>
