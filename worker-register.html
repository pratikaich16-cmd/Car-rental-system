<!DOCTYPE html>
<html>

<head>
    <title>Worker Registration - Easy Car Rental</title>
    <link rel="stylesheet" href="css/worker-register.css">
</head>

<body>

    <h1 align="center">EASY CAR RENTAL</h1>
    <h2 align="center">Worker Registration Form</h2>

    <!-- JS: onsubmit + novalidate -->
    <form action="" method="post" onsubmit="return validateForm()" novalidate>

        <fieldset>
            <legend><b>Personal Information</b></legend>

            <br>

            <label for="name"><b>Full Name:</b></label>
            <br>
            <input type="text" id="name" name="name"
                   placeholder="Enter your full name">
            <span id="nameError"></span> 
            <br><br>

            <label for="email"><b>Email:</b></label>
            <br>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email">
            <span id="emailError"></span> 
            <br><br>

            <label for="phone"><b>Phone Number:</b></label>
            <br>
            <input type="tel" id="phone" name="phone"
                   placeholder="01XXXXXXXXX">
            <span id="phoneError"></span> 

            <br><br>

            <label for="address"><b>Address:</b></label>
            <br>
            <textarea id="address" name="address" rows="3" cols="30"
                      placeholder="Enter your address"></textarea>
            <span id="addressError"></span> 
            <br><br>

            <b>Gender:</b>
            <br>

            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>

            <input type="radio" id="other" name="gender" value="other">
            <label for="other">Other</label>

            <span id="genderError"></span> 
            <br><br>
        </fieldset>

        <br>

        <fieldset>
            <legend><b>Account Information</b></legend>

            <br>

            <label for="username"><b>Username:</b></label>
            <br>
            <input type="text" id="username" name="username"
                   placeholder="Choose a username">
            <span id="usernameError"></span> 
            <br><br>

            <label for="password"><b>Password:</b></label>
            <br>
            <input type="password" id="password" name="password"
                   placeholder="Enter your password">
            <span id="passwordError"></span> 
            <br><br>

            <label for="confirm_password"><b>Confirm Password:</b></label>
            <br>
            <input type="password" id="confirm_password"
                   name="confirm_password"
                   placeholder="Re-enter your password">
            <span id="confirmPasswordError"></span> 

            <br><br>
        </fieldset>

        <br>

        <fieldset>
            <legend><b>Rental Preferences</b></legend>

            <br>

            <label for="car_type"><b>Preferred Car Type:</b></label>
            <br>

            <!-- JS: onchange -->
            <select id="car_type" name="car_type" onchange="checkCarType()">
                <option value="">-- Select Car Type --</option>
                <option value="sedan">Sedan</option>
                <option value="suv">SUV</option>
                <option value="hatchback">Hatchback</option>
                <option value="luxury">Luxury Car</option>
            </select>
            <span id="carTypeError"></span> 
            <br><br>

            <label for="license"><b>Driving License Number:</b></label>
            <br>
            <input type="text" id="license" name="license"
                   placeholder="Enter license number">
            <span id="licenseError"></span> 
            <br><br>
        </fieldset>

        <br>

        <p id="formMessage"></p> 

        <input type="submit" value="Register" class="btn">
        <!-- JS: onclick -->
        <input type="reset" value="Reset" class="btn" onclick="clearMessages()">

        <p>
            Already have an account?
            <a href="login.html">Login Here</a>
        </p>

        <a href="index.html" class="home-link">Back to Home</a>

    </form>

   
    <script src="js/worker-register.js"></script>

</body>

</html>
